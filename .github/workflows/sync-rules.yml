name: Sync sing-box rules

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: tools/srs-compile/go.mod
          cache-dependency-path: tools/srs-compile/go.sum

      - name: Test and build SRS compiler
        working-directory: tools/srs-compile
        run: |
          set -euo pipefail
          go test ./...
          mkdir -p "$RUNNER_TEMP/bin"
          go build -trimpath -o "$RUNNER_TEMP/bin/srs-compile" .

      - name: Clone upstream rules
        env:
          UPSTREAM_REPO: ${{ secrets.UPSTREAM_REPO }}
        run: |
          set -euo pipefail
          test -n "$UPSTREAM_REPO"
          git clone --depth=1 "$UPSTREAM_REPO" "$RUNNER_TEMP/upstream-rules"

      - name: Run Python tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Generate artifacts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/artifacts"
          python -m tools.sync_rules \
            --source-dir "$RUNNER_TEMP/upstream-rules" \
            --output-dir "$RUNNER_TEMP/artifacts" \
            --srs-compiler "$RUNNER_TEMP/bin/srs-compile" \
            --clean
          rm -f "$RUNNER_TEMP/artifacts/.generated-files.txt"

      - name: Publish release branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x tools/publish_release_branch.sh
          tools/publish_release_branch.sh \
            --artifacts-dir "$RUNNER_TEMP/artifacts" \
            --repo "$GITHUB_REPOSITORY" \
            --token "$GITHUB_TOKEN" \
            --branch release \
            --commit-message "chore: publish rule artifacts"
