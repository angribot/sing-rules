name: Sync sing-box rules

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'

permissions:
  contents: write

env:
  SING_BOX_VERSION: '1.13.16'
  SING_BOX_LINUX_AMD64_SHA256: 'e37c312859dfa84cba148f41072ff6369f08361ae91d622dc1fd3aab49611a8d'

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Cache sing-box archive
        uses: actions/cache@v6
        with:
          path: ~/.cache/sing-box/${{ env.SING_BOX_VERSION }}
          key: sing-box-linux-amd64-${{ env.SING_BOX_VERSION }}-${{ env.SING_BOX_LINUX_AMD64_SHA256 }}

      - name: Install sing-box
        run: |
          set -euo pipefail
          package_name="sing-box-${SING_BOX_VERSION}-linux-amd64"
          archive_name="$package_name.tar.gz"
          cache_dir="$HOME/.cache/sing-box/$SING_BOX_VERSION"
          archive_path="$cache_dir/$archive_name"
          asset_url="https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/${archive_name}"

          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/sing-box" "$cache_dir"
          if [[ ! -f "$archive_path" ]]; then
            curl -fsSL "$asset_url" -o "$archive_path"
          fi
          echo "$SING_BOX_LINUX_AMD64_SHA256  $archive_path" | sha256sum --check
          tar -xzf "$archive_path" -C "$RUNNER_TEMP/sing-box"
          install -m 0755 "$RUNNER_TEMP/sing-box/$package_name/sing-box" "$RUNNER_TEMP/bin/sing-box"
          "$RUNNER_TEMP/bin/sing-box" version

      - name: Clone upstream rules
        env:
          UPSTREAM_REPO: ${{ secrets.UPSTREAM_REPO }}
        run: |
          set -euo pipefail
          test -n "$UPSTREAM_REPO"
          git clone --depth=1 "$UPSTREAM_REPO" "$RUNNER_TEMP/upstream-rules"

      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Generate artifacts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/artifacts"
          python -m tools.sync_rules \
            --source-dir "$RUNNER_TEMP/upstream-rules" \
            --output-dir "$RUNNER_TEMP/artifacts" \
            --sing-box "$RUNNER_TEMP/bin/sing-box" \
            --clean
          rm -f "$RUNNER_TEMP/artifacts/.generated-files.txt"

      - name: Publish release branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          chmod +x tools/publish_release_branch.sh
          tools/publish_release_branch.sh \
            --artifacts-dir "$RUNNER_TEMP/artifacts" \
            --repo "$GITHUB_REPOSITORY" \
            --token "$GITHUB_TOKEN" \
            --branch release \
            --commit-message "chore: publish rule artifacts"
